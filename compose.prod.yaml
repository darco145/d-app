version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: d-app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: production_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    image: ghcr.io/darco145/backend:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: production_db
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/darco145/frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  worker:
    image: ghcr.io/darco145/worker:latest
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
