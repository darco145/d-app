name: Publish Docker Images to GHCR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  publish:
    name: Build & Push Docker Image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, worker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.service }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish]
    environment: production 

    steps:
      - uses: actions/checkout@v4

      - name: Simulate Production Deployment
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "=================================================="
          echo "🚀 POKRETANJE PRODUCTION DEPLOY-A"
          echo "Verzija/Tag za deploy: $RELEASE_TAG ($SHORT_SHA)"
          echo "Slike su preuzete sa GHCR skladišta."
          echo "=================================================="
          
