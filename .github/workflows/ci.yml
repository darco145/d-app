name: CI = PR Quality Checks

on: 
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-test-backend:
    name: Backend (Lint & Health Test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
     - name: Checkout code
       uses: actions/checkout@v4
    
     - name: Setup Node.js
       uses: actions/setup-node@v4
       with:
         node-version: '20'
         cache: 'npm'
         cache-dependency-path: backend/package-lock.json

     - name: Install dependencies
       run: npm ci

     - name: Run ESLint
       run: npm run lint

     - name: Run Unit/Health Tests
       run: npm test
  
  lint-and-test-frontend:
    name: Frontend (Lint & Render Test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Tests
        run: npm test
        
  integration-tests-backend:
    name: Backend Integration Tests (PostgreSQL Container)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
        run: npm run test:integration
