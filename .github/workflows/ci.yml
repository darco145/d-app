name: CI = PR Quality Checks

on: 
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute Short SHA Version
        id: get_version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=1.0.${SHORT_SHA}" >> $GITHUB_OUTPUT

  lint-and-test-backend:
    name: Backend (Lint & Health Test)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        include:
          - node-version: 24
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    defaults:
      run:
        working-directory: ./backend

    steps:
     - name: Checkout code
       uses: actions/checkout@v4
    
     - name: Setup Node.js
       uses: actions/setup-node@v4
       with:
         node-version: ${{ matrix.node-version }}
         cache: 'npm'
         cache-dependency-path: backend/package-lock.json

     - name: Install dependencies
       run: npm ci

     - name: Run ESLint
       run: npm run lint

     - name: Run Unit/Health Tests
       run: npm test
          
  integration-tests-backend:
    name: Backend Integration Tests (PostgreSQL Container)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ vars.DB_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ vars.DB_NAME || 'test_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          DB_HOST: ${{ vars.DB_HOST || 'localhost' }}
          DB_PORT: ${{ vars.DB_PORT || '5432' }}
          DB_USER: ${{ vars.DB_USER || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
          DB_NAME: ${{ vars.DB_NAME || 'test_db' }}
        run: npm run test:integration

  frontend-lint:
    name:  Frontend - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
  
  frontend-test:
    name: Frontend - Vitest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend - Build & Upload Artifact
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-matrix-build:
    name: Docker Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [frontend-build, lint-and-test-backend, integration-tests-backend]
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, worker]

    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Artifact (samo za frontend)
        if: matrix.service == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:test
          cache-from: type=gha,scope=docker-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.service }}
  
  verify-images:
    name: Verify Docker Images (Size & Health Check)
    runs-on: ubuntu-latest
    needs: [docker-matrix-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image for Inspection
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:verify
          cache-from: type=gha,scope=docker-frontend

      - name: Check Frontend Image Size (< 60MB)
        run: |
          SIZE_BYTES=$(docker image inspect frontend:verify --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Veličina Frontend Docker slike: ${SIZE_MB} MB"

          if [ $SIZE_MB -gt 60 ]; then
            echo "❌ GREŠKA: Frontend slika je veća od 60 MB (${SIZE_MB} MB)!"
            exit 1
          fi
          echo "✅ Frontend slika je unutar dozvoljene veličine (${SIZE_MB} MB <= 60 MB)."

      - name: Build Backend Image for Verification
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:verify
          cache-from: type=gha,scope=docker-backend

      - name: Run Backend Container & Verify /api/health
        run: |
          docker run -d --name test-backend -p 3000:3000 backend:verify
          sleep 3

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          echo "Odziv sa /api/health: HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ GREŠKA: Backend health check nije prošao! Očekivan 200, dobijen $HTTP_STATUS"
            docker logs test-backend
            exit 1
          fi

          echo "✅ Backend health check uspešan (/api/health vratio 200 OK)."
  
  verify-and-report:
    name: Verify & Generate Markdown Report
    runs-on: ubuntu-latest
    needs: [calculate-version, docker-matrix-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:verify
          cache-from: type=gha,scope=docker-frontend

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:verify
          cache-from: type=gha,scope=docker-backend

      - name: Check Health and Sizes
        id: inspect
        run: |
          FRONTEND_BYTES=$(docker image inspect frontend:verify --format='{{.Size}}')
          FRONTEND_MB=$((FRONTEND_BYTES / 1024 / 1024))

          BACKEND_BYTES=$(docker image inspect backend:verify --format='{{.Size}}')
          BACKEND_MB=$((BACKEND_BYTES / 1024 / 1024))

          if [ $FRONTEND_MB -gt 60 ]; then
            echo "❌ Frontend slika prevelika!"
            exit 1
          fi

          docker run -d --name test-backend -p 3000:3000 backend:verify
          sleep 3
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Backend health failed!"
            exit 1
          fi

          echo "frontend_mb=${FRONTEND_MB}" >> $GITHUB_OUTPUT
          echo "backend_mb=${BACKEND_MB}" >> $GITHUB_OUTPUT

      - name: Generate Markdown Summary Report
        run: |
          echo "## 🚀 CI Pipeline Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verzija generisana iz prvog job-a:** \`${{ needs.calculate-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Servis | Veličina slike | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | ${{ steps.inspect.outputs.frontend_mb }} MB \vert{} ✅ Prošao (< 60MB) \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | ${{ steps.inspect.outputs.backend_mb }} MB \vert{} ✅ Health /api/health 200 OK \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📌 *Izveštaj automatski generisan u sklopu CI provere.*" >> $GITHUB_STEP_SUMMARY
